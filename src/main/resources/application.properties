server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/swift_support
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

app.jwt.secret=default-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-algo
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=86400000
app.ai.enabled=true
app.ai.max-input-length=10000
app.ai.timeout-ms=5000
app.upload.dir=uploads

logging.level.com.SwiftSort=INFO
