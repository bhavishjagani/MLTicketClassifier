<div th:fragment="dashboard" class="space-y-8" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-semibold">Dashboard</h1>
        <a th:href="@{/tickets/new}" class="btn btn-primary">New Ticket</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="stats-container">
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card">
            <h2 class="text-lg font-medium mb-4">Recent Tickets</h2>
            <div id="recent-tickets" class="space-y-3"></div>
        </div>

        <div class="card">
            <h2 class="text-lg font-medium mb-4">Sentiment Trend</h2>
            <canvas id="sentimentChart" height="180"></canvas>
        </div>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
</div>
