<nav th:fragment="sidebar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     class="app-sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-mark">S</div>
    <span class="sidebar-logo-text">SwiftSort</span>
  </div>

  <div class="sidebar-section">Workspace</div>
  <a th:href="@{/dashboard}" class="side-link" th:classappend="${view}=='dashboard'?' active':''">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="6" height="7" rx="1.2"/><rect x="11" y="3" width="6" height="4" rx="1.2"/><rect x="11" y="9" width="6" height="8" rx="1.2"/><rect x="3" y="12" width="6" height="5" rx="1.2"/></svg>
    Dashboard
  </a>
  <a th:href="@{/tickets}" class="side-link" th:classappend="${view}=='tickets'or${view}=='ticket-details'or${view}=='new-ticket'?' active':''">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6a2 2 0 012-2h10a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 000-4V6z"/></svg>
    Tickets
  </a>
  <a th:href="@{/knowledge-base}" class="side-link" th:classappend="${view}=='kb'?' active':''">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5A1.5 1.5 0 015.5 3H10v14H5.5A1.5 1.5 0 014 15.5v-11z"/><path d="M16 4.5A1.5 1.5 0 0014.5 3H10v14h4.5a1.5 1.5 0 001.5-1.5v-11z"/></svg>
    Knowledge base
  </a>
  <a th:href="@{/analytics}" class="side-link" th:classappend="${view}=='analytics'?' active':''">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17V9M9 17V3M15 17v-6" stroke-linecap="round"/></svg>
    Analytics
  </a>

  <div class="sidebar-section" sec:authorize="hasRole('ADMIN')">Admin</div>
  <a th:href="@{/users}" class="side-link" th:classappend="${view}=='users'?' active':''" sec:authorize="hasRole('ADMIN')">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="6" r="2.5"/><path d="M2.5 17c.5-3.5 2.5-5 4.5-5s4 1.5 4.5 5" stroke-linecap="round"/><circle cx="14.5" cy="7" r="2"/><path d="M12.7 12.2c1.7.2 3.3 1.6 3.8 4.8" stroke-linecap="round"/></svg>
    Users
  </a>

  <div class="sidebar-bottom">
    <a th:href="@{/profile}" class="side-link" th:classappend="${view}=='profile'?' active':''">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="7" r="3"/><path d="M4 18a6 6 0 0112 0" stroke-linecap="round"/></svg>
      Profile
    </a>
    <a th:href="@{/settings}" class="side-link" th:classappend="${view}=='settings'?' active':''">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="2.5"/><path d="M10 3v1.5M10 15.5V17M17 10h-1.5M4.5 10H3M14.6 5.4l-1 1M6.4 13.6l-1 1M14.6 14.6l-1-1M6.4 6.4l-1-1" stroke-linecap="round"/></svg>
      Settings
    </a>
  </div>
</nav>
