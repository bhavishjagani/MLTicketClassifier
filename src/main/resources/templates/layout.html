<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}?:'SwiftSort'">SwiftSort</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="app-body">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="app-main">
            <div th:replace="${view} :: ${view}"></div>
        </main>
    </div>
</div>
<div id="toast-stack"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
