<div th:fragment="new-ticket" class="max-w-3xl mx-auto space-y-8" xmlns:th="http://www.w3.org/1999/xhtml">
    <h1 class="text-2xl font-semibold">Create New Ticket</h1>
    <form id="new-ticket-form" class="space-y-6">
        <div class="form-group">
            <label class="form-label">Subject</label>
            <input type="text" name="subject" class="input-field" required>
        </div>
        <div class="form-group">
            <label class="form-label">Message</label>
            <textarea name="message" rows="5" class="input-field" required></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label class="form-label">Product</label>
                <input type="text" name="product" class="input-field">
            </div>
            <div class="form-group">
                <label class="form-label">Customer Reference</label>
                <input type="text" name="customerReference" class="input-field">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label class="form-label">Category</label>
                <select name="category" class="input-field w-full">
                    <option value="">Auto (AI)</option>
                    <option>TECHNICAL_BUG</option><option>LOGIN_ISSUE</option>
                    <option>PAYMENT_ISSUE</option><option>FEATURE_REQUEST</option>
                    <option>GENERAL_ENQUIRY</option><option>OTHER</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Priority</label>
                <select name="priority" class="input-field w-full">
                    <option value="">Auto (AI)</option>
                    <option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit Ticket</button>
    </form>
    <script th:src="@{/js/tickets.js}"></script>
</div>
