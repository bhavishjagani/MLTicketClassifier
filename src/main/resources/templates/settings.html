<div th:fragment="settings" class="max-w-xl space-y-8" xmlns:th="http://www.w3.org/1999/xhtml">
  <h1 class="text-2xl font-semibold">Settings</h1>
  <form id="password-form" class="space-y-6">
    <h2 class="text-lg font-medium mb-4">Change Password</h2>
    <div class="form-group">
      <label class="form-label">Current Password</label>
      <input type="password" id="current-password" class="input-field" required>
    </div>
    <div class="form-group">
      <label class="form-label">New Password</label>
      <input type="password" id="new-password" class="input-field" required>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <input type="password" id="confirm-password" class="input-field" required>
    </div>
    <button type="submit" class="btn btn-primary">Change Password</button>
  </form>

  <div class="border-t border-line pt-8">
    <h2 class="text-lg font-medium mb-4">Preferences</h2>
    <div class="flex items-center justify-between">
      <span class="text-sm">Email notifications</span>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="notif-toggle" class="sr-only peer">
        <div class="w-11 h-6 bg-gray-200 peer-focus:ring-2 peer-focus:ring-teal-300 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal"></div>
      </label>
    </div>
  </div>
  <script th:src="@{/js/settings.js}"></script>
</div>
